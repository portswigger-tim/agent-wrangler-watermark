name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same gate as the local hooks, so a commit made without them still
  # can't reach main. yolo_harden_repo makes this job a required check once it
  # has run on a PR. Add the repo's build and test jobs beside it; prefer
  # adding jobs to renaming them, since a renamed required check blocks PRs.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: portswigger-tim/safer-runner-action@d9772c3c7c5c0f8cd6cb7123e138120b11c12371 # v2.2.1
        with:
          mode: enforce
          # Comments go here, never inside the block below: the action reads
          # every word in it as a domain. gitleaks and actionlint are Go hooks:
          # pre-commit builds them from module downloads.
          allowed-domains: |
            registry.npmjs.org
            pypi.org
            files.pythonhosted.org
            proxy.golang.org
            sum.golang.org
            storage.googleapis.com
          http-filter: |
            github.com:
              "*": GET, HEAD
              "*/git-upload-pack": POST
            api.github.com:
              "*": GET, HEAD
            release-assets.githubusercontent.com:
              "*": GET, HEAD
            registry.npmjs.org:
              "*": GET, HEAD
              "-/npm/v1/security/advisories/bulk": POST
              "-/npm/v1/security/audits/quick": POST
            pypi.org:
              "*": GET, HEAD
            files.pythonhosted.org:
              "*": GET, HEAD
            proxy.golang.org:
              "*": GET, HEAD
            sum.golang.org:
              "*": GET, HEAD
            storage.googleapis.com:
              "*": GET, HEAD
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install pre-commit==4.7.0
      # Validate main with the same branch guard used locally.
      - run: git switch -c ci-verification
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Validate squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
          pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename /tmp/pr-title.txt
